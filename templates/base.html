<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}RateMyDay{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">

    <div class="header-content">

        <a class="logo" href="{{ url_for('index') }}">
            <span class="logo-dot">●</span> RateMyDay
        </a>

        <nav class="nav">
            <a href="{{ url_for('index') }}">Главная</a>
            <a href="{{ url_for('rate') }}">Оценить день</a>
            <a href="{{ url_for('about') }}">О проекте</a>
        </nav>

    </div>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer class="footer">

    <p>RateMyDay - оцени свой день</p>

</footer>

</body>

</html>
