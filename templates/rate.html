{% extends "base.html" %}

{% block title %}Оценка дня - RateMyDay{% endblock %}

{% block content %}

<section class="page-heading">

    <p class="small-title">RATE YOUR DAY</p>

    <h2>Оценка дня</h2>

    <p>
        Заполни форму, чтобы получить свой результат.
    </p>

</section>


{% if error %}

<div class="error">
    {{ error }}
</div>

{% endif %}


<form action="{{ url_for('calculate') }}" method="POST">

    <div class="form-section">

        <label for="name">
            Как тебя зовут?
        </label>

        <p class="hint">
            Имя будет показано на странице результата.
        </p>

        <input
            type="text"
            id="name"
            name="name"
            maxlength="30"
            placeholder="Например, Ярослав"
        >

    </div>


    <div class="form-section">

        <label for="sleep">
            Сколько часов ты спал?
        </label>

        <input
            type="number"
            id="sleep"
            name="sleep"
            min="0"
            max="24"
            step="0.5"
            placeholder="Например, 8"
            required
        >

    </div>


    <div class="form-section">

        <label for="work">
            Сколько часов ты работал или учился?
        </label>

        <input
            type="number"
            id="work"
            name="work"
            min="0"
            max="24"
            step="0.5"
            placeholder="Например, 6"
            required
        >

    </div>


    <div class="form-section">

        <label for="mood">
            Оцени своё настроение от 1 до 10:
        </label>

        <input
            type="number"
            id="mood"
            name="mood"
            min="1"
            max="10"
            placeholder="Например, 8"
            required
        >

    </div>


    <div class="form-section">

        <label>
            Была ли сегодня физическая активность?
        </label>

        <div class="radio-group">

            <label class="radio-label">
                <input
                    type="radio"
                    name="sport"
                    value="yes"
                    required
                >
                Да
            </label>

            <label class="radio-label">
                <input
                    type="radio"
                    name="sport"
                    value="no"
                >
                Нет
            </label>

        </div>

    </div>


    <button type="submit">
        Рассчитать результат
    </button>

</form>

{% endblock %}
